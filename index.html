<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI Intake Dashboard — Last Minute Media Deals</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#0b1220;color:#eef1f7;-webkit-font-smoothing:antialiased}
  a{color:#c9b56a}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
  header{border-bottom:1px solid rgba(255,255,255,.09);background:linear-gradient(180deg,#0f1930,#0b1220)}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:18px 0;gap:16px}
  .bar img{height:38px;display:block;border-radius:4px}
  .bar .who{text-align:right;font-size:11px;color:#9aa3ba;line-height:1.6}
  .hero{padding:26px 0 30px}
  .eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#c9b56a}
  h1{font-size:34px;font-weight:700;letter-spacing:-.4px;margin-top:10px}
  .sub{color:#9aa3ba;font-size:14px;margin-top:10px;line-height:1.6;max-width:640px}
  main{padding:26px 0 60px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .tab{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#c3cade;border-radius:999px;padding:9px 16px;font-size:13px;cursor:pointer;transition:.15s}
  .tab:hover{border-color:rgba(255,255,255,.3)}
  .tab.on{border-color:#c9b56a;background:rgba(201,181,106,.16);color:#fff}
  .updated{font-size:11px;color:#78819a;margin:12px 0 18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:16px 18px}
  .card .l{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#8d96ad}
  .card .v{font-size:30px;font-weight:700;margin-top:7px;letter-spacing:-.5px}
  .card .s{font-size:11.5px;color:#8d96ad;margin-top:5px;line-height:1.45}
  .card.gold .v{color:#d8c27c}
  .panel{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:20px;margin-top:22px}
  .panel h2{font-size:15px;font-weight:600}
  .panel .hint{font-size:11.5px;color:#78819a;margin-top:4px}
  .legend{font-size:11px;color:#8d96ad}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:5px}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .plan{margin-top:14px}
  .planbar{height:9px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
  .planbar span{display:block;height:100%;background:linear-gradient(90deg,#c9b56a,#e0cf94)}
  .planbar.over span{background:linear-gradient(90deg,#e0a06a,#e07a6a)}
  .planrow{display:flex;justify-content:space-between;font-size:12px;color:#9aa3ba;margin-top:9px}
  .call{border-top:1px solid rgba(255,255,255,.075)}
  .call:first-child{border-top:0}
  .callbtn{width:100%;background:none;border:0;color:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:150px 1fr 150px 60px;gap:12px;align-items:center;padding:13px 2px;font:inherit}
  .callbtn:hover{background:rgba(255,255,255,.03)}
  .t{font-size:12.5px;color:#9aa3ba}
  .n{font-size:13.5px}
  .n .meta{color:#78819a}
  .o{font-size:13px;font-weight:600}
  .o.q{color:#d8c27c}.o.u{color:#e0a06a}.o.p{color:#78819a}.o.c{color:#cfd6e6}
  .d{font-size:12.5px;color:#78819a;text-align:right}
  .tag{display:inline-block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#9aa3ba;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:2px 7px;margin-left:8px}
  .body{padding:0 2px 16px;font-size:13.5px;color:#b9c1d4;line-height:1.6}
  .body .urg{color:#e0a06a;margin-bottom:8px}
  audio{width:100%;margin-top:12px}
  .play{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#e6ebf5;border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;margin-top:10px}
  .gate{max-width:520px;margin:60px auto;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:28px}
  .gate label{display:block;font-size:13px;color:#c3cade;margin-bottom:9px}
  .gate input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:12px 14px;color:#fff;font-size:14px;outline:none}
  .gate input:focus{border-color:#c9b56a}
  .gate button{width:100%;margin-top:16px;background:#c9b56a;color:#10192c;border:0;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer}
  .msg{background:rgba(224,122,106,.1);border:1px solid rgba(224,122,106,.3);color:#f0c4bb;border-radius:10px;padding:14px 16px;font-size:13.5px}
  footer{border-top:1px solid rgba(255,255,255,.08);padding:22px 0;font-size:11px;color:#69728a;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  html,body{max-width:100%;overflow-x:hidden}
  .panel{overflow:hidden}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -6px}
  .tablewrap table{min-width:520px}
  @media(max-width:720px){
    .wrap{padding:0 14px}
    .bar{padding:14px 0}.bar img{height:30px}.bar .who{font-size:10px}
    .hero{padding:18px 0 20px}
    h1{font-size:26px}.sub{font-size:13px}
    main{padding:16px 0 40px}
    .filters{gap:6px}.filters .lbl{min-width:100%;margin-bottom:-2px}
    select,.search{width:100%;flex:1 1 100%}
    .chip{padding:6px 10px;font-size:11.5px}
    .cards{grid-template-columns:1fr 1fr;gap:10px}
    .card{padding:12px 13px}.card .v{font-size:24px}.card .s{font-size:11px}
    .card:first-child{grid-column:1/-1}
    .panel{padding:14px}
    .tablewrap{margin:0 -14px;padding:0 14px}
    .tablewrap table{min-width:0;font-size:11.5px;width:100%}
    th,td{padding:7px 3px;white-space:nowrap}
    th{font-size:9px;letter-spacing:.04em}
    .tablewrap .tag{display:none}
    .tablewrap td:first-child,.tablewrap th:first-child{padding-left:0}
    .tablewrap td:last-child,.tablewrap th:last-child{padding-right:0}
    .hm{display:none}
    .callbtn{grid-template-columns:1fr auto;grid-template-areas:"t d" "n n" "o o";gap:3px 10px;padding:11px 2px}
    .callbtn .t{grid-area:t}.callbtn .d{grid-area:d;display:block}.callbtn .n{grid-area:n;display:block;font-size:13px}.callbtn .o{grid-area:o;font-size:12.5px}
    .tag{margin-left:6px}
  }
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
  .filters .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#78819a;margin-right:4px;min-width:64px}
  .chip{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#c3cade;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer}
  .chip.on{border-color:#c9b56a;background:rgba(201,181,106,.16);color:#fff}
  .chip small{color:#78819a;margin-left:5px}
  select,.search{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:10px;color:#fff;padding:9px 12px;font-size:13px;outline:none}
  select:focus,.search:focus{border-color:#c9b56a}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
  th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#78819a;padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.1)}
  td{padding:9px 6px;border-bottom:1px solid rgba(255,255,255,.06)}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  tr.sel td{background:rgba(201,181,106,.08)}
  tr.tot td{font-weight:700;border-top:1px solid rgba(255,255,255,.18)}
  .over{color:#e0a06a}
  .more{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#e6ebf5;border-radius:8px;padding:9px 16px;font-size:12.5px;cursor:pointer;margin-top:14px}
  .building{font-size:12px;color:#c9b56a;margin-top:8px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="bar">
    <img src="lmm-logo.jpg" alt="Last Minute Media Deals">
    <div class="who" id="who"></div>
  </div>
  <div class="hero">
    <p class="eyebrow">AI Intake Dashboard</p>
    <h1 id="title">Loading…</h1>
    <p class="sub" id="sub"></p>
  </div>
</div></header>
<main class="wrap" id="main"></main>
<footer class="wrap">
  <span>Produced by <b style="color:#8d96ad">Last Minute Media Deals</b> · rich@lastminutemediadeals.com</span>
  <span id="stamp"></span>
</footer>

<script>
const POINTER="https://boris148.github.io/se-portal/endpoint.json";
const KEY="lmmd_portal_token";
let API=null,TOKEN=null,DATA=null;
let PERIOD="this",CHANNEL="all",OUTCOME="all",SEARCH="",SHOW=50;

const q=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dur=s=>{if(!s)return"0:00";const m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0")};
const tel=p=>{const d=String(p||"").replace(/\D/g,"").slice(-10);return d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:(p||"")};
const when=iso=>new Date(iso).toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
const money=n=>"$"+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const monthName=m=>new Date(m+"-15T12:00:00").toLocaleString(undefined,{month:"long",year:"numeric"});
const OUTCOMES=[["all","All outcomes"],["qualified","Qualified"],["urgent","Urgent callback"],["conversation","Completed (spoke with a person)"],["voicemail","Voicemail / screener"],["poor","Poor fit"],["noanswer","No answer"]];

async function base(){if(API)return API;const r=await fetch(POINTER+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("The dashboard is temporarily unavailable. Please try again shortly.");const j=await r.json();if(!j.api)throw new Error("The dashboard is temporarily unavailable. Please try again shortly.");API=j.api;return API}

function gate(msg){
  q("#title").textContent="Your intake dashboard";
  q("#sub").textContent="Open the private link from your welcome email, or paste it below.";
  q("#main").innerHTML=`<div class="gate">${msg?`<div class="msg" style="margin-bottom:18px">${esc(msg)}</div>`:""}
    <label for="k">Dashboard link or access code</label>
    <input id="k" placeholder="https://…/?c=…" autocomplete="off">
    <button id="go">Open dashboard</button>
    <p style="font-size:11.5px;color:#78819a;margin-top:14px">Need a new link? Email rich@lastminutemediadeals.com.</p></div>`;
  q("#go").onclick=()=>{const v=q("#k").value.trim();const m=v.match(/[?&]c=([A-Za-z0-9_-]+)/);const t=m?m[1]:v;if(!t)return;localStorage.setItem(KEY,t);location.search="?c="+encodeURIComponent(t)};
  q("#k").addEventListener("keydown",e=>{if(e.key==="Enter")q("#go").click()});
}

function stat(l,v,s,gold){return `<div class="card${gold?" gold":""}"><div class="l">${l}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:""}</div>`}

function months(){const s=new Set(DATA.rows.map(r=>r.month));return [...s].sort().reverse()}
function thisMonth(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function periodRows(){
  const now=Date.now()/1000;
  if(PERIOD==="all")return DATA.rows;
  if(PERIOD==="7d")return DATA.rows.filter(r=>r.ts>=now-7*86400);
  if(PERIOD==="30d")return DATA.rows.filter(r=>r.ts>=now-30*86400);
  const m=PERIOD==="this"?thisMonth():PERIOD;
  return DATA.rows.filter(r=>r.month===m);
}
function outcomeOk(r){
  switch(OUTCOME){case"qualified":return r.qualified;case"urgent":return r.urgent;case"conversation":return r.conversation;
    case"voicemail":return !!r.picked_up&&!r.completed;case"poor":return r.quality==="POOR";case"noanswer":return !r.picked_up;default:return true}
}
function filtered(){
  const s=SEARCH.trim().toLowerCase();
  return periodRows().filter(r=>(CHANNEL==="all"||r.channel===CHANNEL)&&outcomeOk(r)&&(!s||(r.name||"").toLowerCase().includes(s)||(r.phone||"").includes(s)||(r.case_type||"").toLowerCase().includes(s)||(r.summary||"").toLowerCase().includes(s)));
}
function agg(rows){
  const a={calls:rows.length,completed:0,conversations:0,qualified:0,urgent:0,inbound:0,outbound:0,secs:0,picked:0,vm:0};
  rows.forEach(r=>{a.completed+=r.completed;a.conversations+=r.conversation;a.picked+=!!r.picked_up;a.vm+=(!!r.picked_up&&!r.completed);a.qualified+=r.qualified;a.urgent+=r.urgent;a.inbound+=r.direction==="Inbound";a.outbound+=r.direction!=="Inbound";a.secs+=r.duration});
  a.avg=a.completed?Math.round(a.secs/a.completed):0;return a;
}
function billing(){
  const p=DATA.plan,inc=p.included||300,ov=p.overage||1.5;
  const ms=[...new Set(DATA.rows.map(r=>r.month))].sort();
  return ms.filter(m=>!p.first_month||m>=p.first_month).map(m=>{
    const rows=DATA.rows.filter(r=>r.month===m),a=agg(rows),over=Math.max(0,a.completed-inc);
    const fee=m===p.first_month?(p.first_month_fee||p.monthly_fee||0):(p.monthly_fee||0);
    return {m,calls:a.calls,completed:a.completed,vm:a.vm,conversations:a.conversations,qualified:a.qualified,over,overage:over*ov,fee,total:fee+over*ov,current:m===thisMonth()};
  }).reverse();
}
function chart(rows){
  const daily=PERIOD==="all";
  const buckets={};
  if(daily){DATA.rows.forEach(r=>{});
    const ms=[...new Set(DATA.rows.map(r=>r.month))].sort();ms.forEach(m=>buckets[m]={k:m,calls:0,hi:0});
    rows.forEach(r=>{buckets[r.month].calls++;buckets[r.month].hi+=r.conversation});
  }else{
    const pr=periodRows();const days=[...new Set(pr.map(r=>r.day))].sort();
    let lo=days[0],hi=days[days.length-1];
    if(PERIOD==="this"||/^\d{4}-\d{2}$/.test(PERIOD)){const m=PERIOD==="this"?thisMonth():PERIOD;const n=new Date(m+"-01T12:00:00");const last=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();for(let d=1;d<=last;d++){const k=m+"-"+String(d).padStart(2,"0");buckets[k]={k,calls:0,hi:0}}}
    else{const n=PERIOD==="7d"?7:30;for(let i=n-1;i>=0;i--){const d=new Date(Date.now()-i*86400000);const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");buckets[k]={k,calls:0,hi:0}}}
    rows.forEach(r=>{if(buckets[r.day]){buckets[r.day].calls++;buckets[r.day].hi+=r.conversation}});
  }
  const arr=Object.values(buckets);if(!arr.length)return"";
  const max=Math.max(1,...arr.map(d=>d.calls)),W=900,H=170,pad=8,bw=(W-pad*2)/arr.length,step=Math.max(1,Math.round(arr.length/7));
  let g="";
  arr.forEach((d,i)=>{const h=d.calls/max*H,hb=d.hi/max*H,x=pad+i*bw;
    g+=`<rect x="${x+2}" y="${H-h}" width="${Math.max(2,bw-4)}" height="${h}" rx="3" fill="rgba(255,255,255,.17)"><title>${d.k}: ${d.calls} calls, ${d.hi} conversations</title></rect>`;
    if(hb>0)g+=`<rect x="${x+2}" y="${H-hb}" width="${Math.max(2,bw-4)}" height="${hb}" rx="3" fill="#c9b56a"></rect>`;
    if(i%step===0)g+=`<text x="${x+bw/2}" y="${H+20}" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.45)">${daily?monthName(d.k).slice(0,3):d.k.slice(5).replace("-","/")}</text>`});
  return `<svg viewBox="0 0 ${W} ${H+28}" style="width:100%" role="img" aria-label="Call volume">${g}</svg>`;
}
function cls(o){return /Qualified/.test(o)?"q":/Urgent/.test(o)?"u":/No answer|Poor/.test(o)?"p":"c"}

function render(){
  const d=DATA,p=d.plan||{};
  q("#who").innerHTML=`Prepared for<br><b style="color:#c3cade">${esc(d.client.business)}</b>`;
  q("#title").textContent=d.client.business;
  q("#sub").textContent=`${d.client.agent_name||"Your AI intake assistant"} on ${d.client.line}. Answering your intake line and calling every new lead back within minutes, day and night. Every call since launch, live.`;
  q("#stamp").textContent="Updated "+new Date(d.generated_at||Date.now()).toLocaleTimeString();
  const pr=periodRows(),rows=filtered(),t=agg(rows),tAll=agg(pr);
  const chans=[...new Set(pr.map(r=>r.channel))].map(c=>[c,pr.filter(r=>r.channel===c).length]).sort((a,b)=>b[1]-a[1]);
  const ms=months();
  const label=PERIOD==="all"?"All time":PERIOD==="7d"?"Last 7 days":PERIOD==="30d"?"Last 30 days":monthName(PERIOD==="this"?thisMonth():PERIOD);
  const bill=billing();const cur=bill.find(b=>b.m===(PERIOD==="this"?thisMonth():PERIOD));
  q("#main").innerHTML=`
  <div class="filters"><span class="lbl">Period</span>
    <select id="period">
      <option value="this"${PERIOD==="this"?" selected":""}>This month</option>
      <option value="7d"${PERIOD==="7d"?" selected":""}>Last 7 days</option>
      <option value="30d"${PERIOD==="30d"?" selected":""}>Last 30 days</option>
      ${ms.filter(m=>m!==thisMonth()).map(m=>`<option value="${m}"${PERIOD===m?" selected":""}>${monthName(m)}</option>`).join("")}
      <option value="all"${PERIOD==="all"?" selected":""}>All time (since launch)</option>
    </select>
    <input class="search" id="search" placeholder="Search name, phone, case type…" value="${esc(SEARCH)}" style="flex:1;min-width:200px">
  </div>
  <div class="filters"><span class="lbl">Channel</span>
    <button class="chip${CHANNEL==="all"?" on":""}" data-c="all">All<small>${pr.length}</small></button>
    ${chans.map(([c,n])=>`<button class="chip${CHANNEL===c?" on":""}" data-c="${esc(c)}">${esc(c.replace(" callback","").replace("Chase re-engagement","Chase pass"))}<small>${n}</small></button>`).join("")}
  </div>
  <div class="filters"><span class="lbl">Outcome</span>
    ${OUTCOMES.map(([k,l])=>`<button class="chip${OUTCOME===k?" on":""}" data-o="${k}">${l}</button>`).join("")}
  </div>
  ${d.building?`<p class="building">Still importing older calls in the background. Numbers will fill in as it finishes.</p>`:""}
  <div class="updated" style="margin-top:16px">${label}${CHANNEL!=="all"||OUTCOME!=="all"||SEARCH?` · filtered to ${rows.length} of ${pr.length} calls`:""} · ${t.inbound} inbound · ${t.outbound} callbacks</div>
  <div class="cards">
    ${stat("Completed calls",t.completed,`${t.calls} dialed or received · ${t.picked} picked up`)}
    ${stat("Voicemails left",t.vm,"Picked up by voicemail or a screener")}
    ${stat("Qualified leads",t.qualified,"Rated good or fair, notes in Lead Docket",1)}
    ${stat("Urgent callbacks",t.urgent,"Asked the firm to call same day")}
    ${stat("Avg call length",dur(t.avg),`${Math.round(t.secs/60)} minutes on the phone`)}
  </div>

  <div class="panel">
    <div class="head"><div><h2>Plan &amp; billing</h2>
    <p class="hint">${p.included||300} completed intake calls included each month; additional completed calls ${money(p.overage||1.5)} each. A completed call is one where a real person spoke with ${esc(d.client.agent_name||"the assistant")}. Voicemails, screeners and no-answers are not counted.</p></div></div>
    ${cur?`<div class="planbar${cur.over?" over":""}" style="margin-top:14px"><span style="width:${Math.min(100,Math.round(cur.completed/(p.included||300)*100))}%"></span></div>
    <div class="planrow"><span><b style="color:#e6ebf5">${cur.completed}</b> of ${p.included||300} completed intake calls in ${monthName(cur.m)}</span>
    <span>${cur.over?`<b class="over">${cur.over} over · ${money(cur.overage)}</b>`:`${(p.included||300)-cur.completed} remaining`}</span></div>`:""}
    <div class="tablewrap"><table><tr><th>Month</th><th class="n hm">Dialed</th><th class="n">Completed</th><th class="n hm">Voicemails</th><th class="n hm">Qualified</th><th class="n">Over</th><th class="n">Over&nbsp;$</th><th class="n hm">Service fee</th><th class="n">Total</th></tr>
    ${bill.map(b=>`<tr class="${b.m===(PERIOD==="this"?thisMonth():PERIOD)?"sel":""}"><td>${monthName(b.m).slice(0,3)} '${b.m.slice(2,4)}${b.current?' <span class="tag">now</span>':""}</td><td class="n hm">${b.calls}</td><td class="n">${b.completed}</td><td class="n hm">${b.vm}</td><td class="n hm">${b.qualified}</td><td class="n${b.over?" over":""}">${b.over||"—"}</td><td class="n${b.over?" over":""}">${b.over?money(b.overage):"—"}</td><td class="n hm">${b.fee?money(b.fee):"—"}</td><td class="n">${money(b.total)}</td></tr>`).join("")}
    <tr class="tot"><td>Total</td><td class="n hm">${bill.reduce((s,b)=>s+b.calls,0)}</td><td class="n">${bill.reduce((s,b)=>s+b.completed,0)}</td><td class="n hm">${bill.reduce((s,b)=>s+b.vm,0)}</td><td class="n hm">${bill.reduce((s,b)=>s+b.qualified,0)}</td><td class="n">${bill.reduce((s,b)=>s+b.over,0)||"—"}</td><td class="n">${money(bill.reduce((s,b)=>s+b.overage,0))}</td><td class="n hm">${money(bill.reduce((s,b)=>s+b.fee,0))}</td><td class="n">${money(bill.reduce((s,b)=>s+b.total,0))}</td></tr></table></div>
    <p class="hint" style="margin-top:10px">Overage is calculated from the call platform; invoices come from Last Minute Media Deals. Questions: rich@lastminutemediadeals.com.</p>
  </div>

  <div class="panel">
    <div class="head"><h2>Call volume · ${label}</h2>
      <p class="legend"><i style="background:rgba(255,255,255,.25)"></i>all calls <span style="margin-left:14px"></span><i style="background:#c9b56a"></i>completed</p></div>
    <div style="margin-top:14px">${chart(rows)}</div>
  </div>

  <div class="panel">
    <h2>Calls · ${label}</h2>
    <p class="hint">Tap any call for the summary and recording. ${rows.length} call${rows.length===1?"":"s"} match the current filters.</p>
    <div style="margin-top:12px">${rows.length?rows.slice(0,SHOW).map((c,i)=>`
      <div class="call">
        <button class="callbtn" data-i="${i}">
          <span class="t">${when(c.time)}<span class="tag">${esc(c.direction)}</span></span>
          <span class="n">${esc(c.name||tel(c.phone)||"Unknown caller")}<span class="meta"> · ${esc(c.channel)}${c.case_type?" · "+esc(c.case_type):""}</span></span>
          <span class="o ${cls(c.outcome)}">${esc(c.outcome)}</span>
          <span class="d">${dur(c.duration)}</span>
        </button>
        <div class="body" id="b${i}" hidden></div>
      </div>`).join(""):`<p style="color:#8d96ad;font-size:13.5px;padding:14px 0">No calls match these filters.</p>`}</div>
    ${rows.length>SHOW?`<button class="more" id="more">Show ${Math.min(50,rows.length-SHOW)} more</button>`:""}
  </div>`;
  q("#period").onchange=e=>{PERIOD=e.target.value;CHANNEL="all";SHOW=50;render()};
  q("#search").oninput=e=>{SEARCH=e.target.value;SHOW=50;render();q("#search").focus();q("#search").setSelectionRange(SEARCH.length,SEARCH.length)};
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{CHANNEL=b.dataset.c;SHOW=50;render()});
  document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{OUTCOME=b.dataset.o;SHOW=50;render()});
  const more=q("#more");if(more)more.onclick=()=>{SHOW+=50;render();window.scrollTo(0,document.body.scrollHeight-1400)};
  document.querySelectorAll(".callbtn").forEach(b=>b.onclick=()=>{
    const i=b.dataset.i,c=rows[i],el=q("#b"+i);
    if(!el.hidden){el.hidden=true;return}
    el.hidden=false;
    el.innerHTML=`${c.urgent?`<p class="urg">Urgent: same-day callback requested</p>`:""}
      <p style="color:#78819a;font-size:12px;margin-bottom:6px">${esc(c.channel)}${c.source&&c.source!==c.channel?" · source: "+esc(c.source):""}${c.ld_status?" · Lead Docket status: "+esc(c.ld_status):""}${c.phone?" · "+tel(c.phone):""}</p>
      <p>${esc(c.summary||"No summary available for this call.")}</p>
      ${c.has_audio?`<button class="play">Play recording</button>`:""}`;
    const pb=el.querySelector(".play");
    if(pb)pb.onclick=()=>{const a=document.createElement("audio");a.controls=true;a.preload="none";a.src=`${API}/portal/${encodeURIComponent(TOKEN)}/audio/${c.id}`;pb.replaceWith(a)};
  });
}

async function load(){
  const r=await fetch(`${await base()}/portal/${encodeURIComponent(TOKEN)}/history`);
  if(r.status===404){localStorage.removeItem(KEY);return gate("That dashboard link isn't valid. Check the link from your welcome email.")}
  if(!r.ok)throw new Error("Couldn't load your dashboard right now. Please try again in a minute.");
  DATA=await r.json();
  if(DATA.building&&!DATA.rows.length){q("#title").textContent=DATA.client.business;q("#sub").textContent="Importing your call history. This takes a few minutes the first time.";setTimeout(()=>load().catch(()=>{}),15000);return}
  render();
}

(async()=>{
  const u=new URLSearchParams(location.search).get("c");
  TOKEN=u||localStorage.getItem(KEY);
  if(u)localStorage.setItem(KEY,u);
  if(!TOKEN)return gate();
  try{await load();setInterval(()=>load().catch(()=>{}),180000)}
  catch(e){gate(e.message)}
})();
</script>
</body>
</html>
